<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopi Senja — Coffee & Contemplation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap">
<style>
  :root {
    --bg: #EAE4D9;
    --cream: #F3F0EB;
    --charcoal: #1C1C1C;
    --earth: #2A2A2A;
    --accent: #8C7B6B;
    --rule: rgba(28,28,28,0.12);
    --ease-quiet: cubic-bezier(.22, 1, .36, 1);
    --ease-precise: cubic-bezier(.4, 0, .2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    background: var(--bg);
    color: var(--charcoal);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--cream); }

  h1, h2, h3, h4 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }

  .eyebrow {
    display: inline-block;
    font: 500 12px/1 'Inter', sans-serif;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 700ms var(--ease-quiet), transform 700ms var(--ease-quiet);
  }
  .is-in .eyebrow { opacity: 1; transform: none; transition-delay: 100ms; }
  .eyebrow::after {
    content: '';
    display: inline-block;
    width: 0; height: 1px;
    margin-left: 0.75rem;
    vertical-align: middle;
    background: currentColor;
    transition: width 800ms var(--ease-quiet) 400ms;
  }
  .is-in .eyebrow::after { width: 2rem; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.5rem 2.5rem;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 400ms var(--ease-quiet), padding 400ms var(--ease-quiet);
  }
  nav.scrolled {
    background: rgba(234, 228, 217, 0.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 1rem 2.5rem; box-shadow: 0 1px 0 var(--rule);
  }
  .logo {
    font-family: 'Cormorant Garamond', serif; font-size: 1.6rem;
    font-weight: 500; letter-spacing: 0.02em; color: var(--cream);
    transition: color 400ms var(--ease-quiet); text-decoration: none;
  }
  nav.scrolled .logo { color: var(--charcoal); }
  .logo span { color: var(--accent); }

  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a {
    font-size: 13px; letter-spacing: 0.08em; color: var(--cream);
    text-decoration: none; text-transform: uppercase; font-weight: 400;
    transition: color 400ms var(--ease-quiet); position: relative;
  }
  nav.scrolled .nav-links a { color: var(--charcoal); }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; bottom: -4px;
    width: 0; height: 1px; background: var(--accent);
    transition: width 300ms var(--ease-quiet);
  }
  .nav-links a:hover::after { width: 100%; }

  .nav-right { display: flex; align-items: center; gap: 1.5rem; }

  .btn-auth {
    font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 0.7rem 1.4rem;
    background: transparent; border: 1px solid var(--cream); color: var(--cream);
    cursor: pointer; transition: all 300ms var(--ease-precise); border-radius: 2px;
  }
  nav.scrolled .btn-auth { border-color: var(--charcoal); color: var(--charcoal); }
  .btn-auth:hover { background: var(--accent); border-color: var(--accent); color: var(--cream); }
  .btn-auth.user-btn {
    display: none; align-items: center; gap: 0.5rem;
    background: var(--accent); border-color: var(--accent); color: var(--cream);
  }
  .btn-auth.user-btn.active { display: inline-flex; }
  .btn-auth.user-btn:hover { background: var(--earth); border-color: var(--earth); }
  .user-avatar {
    width: 22px; height: 22px; border-radius: 50%; background: var(--cream);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; font-family: 'Cormorant Garamond', serif;
  }

  .hero {
    position: relative; height: 100vh; min-height: 700px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .hero-bg { position: absolute; inset: 0; overflow: hidden; }
  .hero-bg img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 25s ease-in-out infinite alternate; }
  @keyframes kenburns {
    0%   { transform: scale(1.1) translate(-1%, -1%); }
    100% { transform: scale(1.2) translate(1%, 1%); }
  }
  .hero-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(28,28,28,0.5) 0%, rgba(28,28,28,0.3) 50%, rgba(28,28,28,0.7) 100%);
  }
  .hero-content {
    position: relative; z-index: 2; text-align: center;
    color: var(--cream); padding: 0 2rem; max-width: 900px;
  }
  .hero-content .eyebrow { color: var(--cream); opacity: 0.8; }
  .hero h1 {
    font-size: clamp(3rem, 8vw, 6.5rem); font-weight: 500;
    margin: 1.5rem 0; color: var(--cream);
  }
  .hero h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
  .hero-sub {
    font-size: 1.05rem; max-width: 540px; margin: 2rem auto;
    color: rgba(243, 240, 235, 0.85); line-height: 1.7;
  }
  .hero-cta {
    display: flex; gap: 1rem; justify-content: center; margin-top: 3rem; flex-wrap: wrap;
  }
  .btn {
    font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 1rem 2rem; cursor: pointer;
    border: 1px solid var(--cream); background: transparent; color: var(--cream);
    transition: all 300ms var(--ease-precise); text-decoration: none; display: inline-block; border-radius: 2px;
  }
  .btn:hover { background: var(--cream); color: var(--charcoal); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--cream); }
  .btn-primary:hover { background: var(--earth); border-color: var(--earth); }
  .btn-dark { background: var(--charcoal); border-color: var(--charcoal); color: var(--cream); }
  .btn-dark:hover { background: var(--earth); border-color: var(--earth); }

  .orbital-badge { position: absolute; bottom: 3rem; right: 3rem; width: 140px; height: 140px; z-index: 3; }
  .orbital-badge svg { width: 100%; height: 100%; animation: spin-cw 22s linear infinite; }
  @keyframes spin-cw { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .orbital-badge text {
    fill: var(--cream); font-family: 'Inter', sans-serif;
    font-size: 10px; letter-spacing: 0.25em; font-weight: 400; text-transform: uppercase;
  }
  .orbital-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--cream); font-size: 22px; animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, -60%); }
  }

  .scroll-hint {
    position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
    color: var(--cream); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    opacity: 0.6; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
  }
  .scroll-hint::after {
    content: ''; width: 1px; height: 30px; background: var(--cream);
    animation: scroll-line 2s ease-in-out infinite;
  }
  @keyframes scroll-line {
    0%, 100% { transform: scaleY(0.3); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
  }

  /* JARAK ANTAR SECTION DIRAPATKAN */
  section { padding: 5rem 2rem; position: relative; }
  .container { max-width: 1400px; margin: 0 auto; }

  .about { background: var(--cream); }
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
  .about-img { aspect-ratio: 4/5; overflow: hidden; border-radius: 2px; position: relative; }
  .about-img img { width: 100%; height: 100%; object-fit: cover; animation: breathe 18s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1.02); }
    50% { transform: scale(1.08); }
  }
  .about-text h2 { font-size: clamp(2.5rem, 5vw, 4rem); margin: 1.5rem 0 2rem; font-weight: 500; }
  .about-text h2 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .about-text p { margin-bottom: 1.5rem; color: var(--earth); font-size: 1.02rem; line-height: 1.8; }
  .pullquote {
    font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-style: italic;
    color: var(--accent); border-left: 2px solid var(--accent); padding-left: 1.5rem;
    margin: 2rem 0; line-height: 1.4;
  }
  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem;
    margin-top: 3rem; padding-top: 3rem; border-top: 1px solid var(--rule);
  }
  .stat-num { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; color: var(--charcoal); font-weight: 500; }
  .stat-label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-top: 0.5rem; }

  .experiences { background: var(--bg); padding: 0; }
  .stack-header { text-align: center; padding: 5rem 2rem 3rem; }
  .stack-header h2 { font-size: clamp(2.5rem, 5vw, 4rem); margin: 1.5rem 0; font-weight: 500; }
  .stack-header h2 em { font-style: italic; color: var(--accent); }
  .stack-header p { max-width: 540px; margin: 1rem auto; color: var(--earth); }

  .cardstack { position: relative; height: 400vh; }
  .cardstack-pin { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cardstack-card {
    position: absolute; width: min(80vw, 900px); height: min(75vh, 600px);
    background: var(--cream); border-radius: 4px; overflow: hidden;
    box-shadow: 0 35px 80px -20px rgba(28,28,28,0.25); display: grid; grid-template-columns: 1fr 1fr;
  }
  .cardstack-card .card-img { height: 100%; overflow: hidden; position: relative; }
  .cardstack-card .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .cardstack-card .card-content { padding: 3rem; display: flex; flex-direction: column; justify-content: center; }
  .card-num { font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--accent); letter-spacing: 0.2em; margin-bottom: 1rem; }
  .cardstack-card h3 { font-size: clamp(2rem, 3.5vw, 2.8rem); margin-bottom: 1.5rem; font-weight: 500; line-height: 1.15; }
  .cardstack-card h3 em { font-style: italic; color: var(--accent); }
  .cardstack-card p { color: var(--earth); margin-bottom: 2rem; font-size: 0.98rem; line-height: 1.7; }
  .card-meta { display: flex; gap: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); margin-top: auto; }
  .card-meta-item .label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.3rem; }
  .card-meta-item .value { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--charcoal); }

  .menu { background: var(--cream); padding: 5rem 2rem; }
  .menu-header { text-align: center; margin-bottom: 3rem; }
  .menu-header h2 { font-size: clamp(2.5rem, 5vw, 4rem); margin: 1.5rem 0; font-weight: 500; }
  .menu-header h2 em { font-style: italic; color: var(--accent); }
  .menu-header p { max-width: 540px; margin: 1rem auto; color: var(--earth); }
  .menu-tabs { display: flex; justify-content: center; gap: 0.5rem; margin: 2.5rem 0 3rem; flex-wrap: wrap; }
  .menu-tab {
    padding: 0.7rem 1.5rem; background: transparent; border: 1px solid var(--rule);
    color: var(--earth); font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: 0.15em;
    text-transform: uppercase; cursor: pointer; transition: all 300ms var(--ease-precise); border-radius: 2px;
  }
  .menu-tab:hover { border-color: var(--accent); color: var(--accent); }
  .menu-tab.active { background: var(--charcoal); border-color: var(--charcoal); color: var(--cream); }
  .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; max-width: 1200px; margin: 0 auto; }
  .menu-item {
    display: flex; flex-direction: column; background: var(--bg); border-radius: 4px; overflow: hidden;
    transition: transform 400ms var(--ease-quiet), box-shadow 400ms var(--ease-quiet);
  }
  .menu-item:hover { transform: translateY(-4px); box-shadow: 0 15px 35px -10px rgba(28,28,28,0.15); }
  .menu-item-img { aspect-ratio: 4/3; overflow: hidden; background: var(--earth); }
  .menu-item-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease-quiet); }
  .menu-item:hover .menu-item-img img { transform: scale(1.06); }
  .menu-item-body { padding: 1.3rem 1.4rem 1.4rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .menu-item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.8rem; }
  .menu-item-info h4 { font-size: 1.3rem; font-weight: 500; line-height: 1.2; }
  .menu-item-price { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; color: var(--accent); font-weight: 500; white-space: nowrap; }
  .menu-item-info p { font-size: 0.84rem; color: var(--earth); opacity: 0.72; line-height: 1.5; margin-top: 0.2rem; }
  .menu-item-tag {
    display: inline-block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); margin-top: 0.4rem; padding-top: 0.6rem; border-top: 1px solid var(--rule);
  }

  .craft { background: var(--bg); }
  .craft-header { text-align: center; margin-bottom: 4rem; }
  .craft-header h2 { font-size: clamp(2.5rem, 5vw, 4rem); margin: 1.5rem 0; font-weight: 500; }
  .craft-header h2 em { font-style: italic; color: var(--accent); }
  .zigzag-item { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; margin-bottom: 5rem; max-width: 1200px; margin-left: auto; margin-right: auto; }
  .zigzag-item:last-child { margin-bottom: 0; }
  .zigzag-item[data-reverse] .zigzag-text { order: 2; }
  .zigzag-img { aspect-ratio: 4/5; overflow: hidden; border-radius: 2px; }
  .zigzag-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease-quiet); }
  .zigzag-item:hover .zigzag-img img { transform: scale(1.04); }
  .zigzag-text .eyebrow { color: var(--accent); }
  .zigzag-text h3 { font-size: clamp(2rem, 3.5vw, 2.8rem); margin: 1.5rem 0; font-weight: 500; }
  .zigzag-text h3 em { font-style: italic; color: var(--accent); }
  .zigzag-text p { color: var(--earth); margin-bottom: 1.5rem; line-height: 1.8; }
  .zigzag-meta { display: flex; gap: 2.5rem; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--rule); }
  .zigzag-meta-item .label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.3rem; }
  .zigzag-meta-item .value { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: var(--charcoal); }

  .gallery { background: var(--cream); padding: 5rem 2rem; }
  .gallery-header { text-align: center; margin-bottom: 3rem; }
  .gallery-header h2 { font-size: clamp(2.5rem, 5vw, 4rem); margin: 1.5rem 0; font-weight: 500; }
  .gallery-header h2 em { font-style: italic; color: var(--accent); }
  .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 220px; gap: 1rem; max-width: 1400px; margin: 0 auto; }
  .gallery-item { overflow: hidden; border-radius: 2px; position: relative; cursor: pointer; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease-quiet), filter 600ms; }
  .gallery-item:hover img { transform: scale(1.06); filter: brightness(0.9); }
  .gallery-item.tall { grid-row: span 2; }
  .gallery-item.wide { grid-column: span 2; }

  .visit { background: var(--charcoal); color: var(--cream); }
  .visit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
  .visit-text .eyebrow { color: var(--accent); }
  .visit-text h2 { font-size: clamp(2.5rem, 5vw, 4rem); margin: 1.5rem 0 2rem; color: var(--cream); font-weight: 500; }
  .visit-text h2 em { font-style: italic; color: var(--accent); }
  .visit-text p { color: rgba(243, 240, 235, 0.75); margin-bottom: 2rem; line-height: 1.8; }
  .visit-info { display: grid; gap: 2rem; }
  .info-block { padding-bottom: 2rem; border-bottom: 1px solid rgba(243, 240, 235, 0.15); }
  .info-block:last-child { border-bottom: none; }
  .info-block .label { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.7rem; }
  .info-block .value { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; line-height: 1.5; color: var(--cream); }
  .info-block .sub { font-size: 0.9rem; color: rgba(243, 240, 235, 0.6); margin-top: 0.4rem; }
  .info-block a { color: var(--cream); text-decoration: none; border-bottom: 1px solid var(--accent); transition: color 200ms; }
  .info-block a:hover { color: var(--accent); }

  .reserve { background: var(--bg); }
  .reserve-header { text-align: center; margin-bottom: 3rem; }
  .reserve-header h2 { font-size: clamp(2.5rem, 5vw, 4rem); margin: 1.5rem 0; font-weight: 500; }
  .reserve-header h2 em { font-style: italic; color: var(--accent); }
  .reserve-header p { max-width: 540px; margin: 1rem auto; color: var(--earth); }
  .reserve-form-wrap { max-width: 720px; margin: 0 auto; background: var(--cream); padding: 3rem; border-radius: 4px; }
  .reserve-form-wrap > .locked-msg { display: none; text-align: center; padding: 3rem 1rem; }
  .reserve-form-wrap.locked .reserve-form { display: none; }
  .reserve-form-wrap.locked .locked-msg { display: block; }
  .locked-msg h3 { font-size: 2rem; margin-bottom: 1rem; }
  .locked-msg p { color: var(--earth); margin-bottom: 2rem; }
  .locked-icon { width: 60px; height: 60px; border: 1px solid var(--accent); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--accent); font-size: 24px; margin-bottom: 1.5rem; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  .form-field { display: flex; flex-direction: column; }
  .form-field.full { grid-column: span 2; }
  .form-field label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.6rem; }
  .form-field input, .form-field select, .form-field textarea {
    background: transparent; border: none; border-bottom: 1px solid var(--rule);
    padding: 0.7rem 0; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: var(--charcoal);
    transition: border-color 300ms; font-weight: 300;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: none; border-bottom-color: var(--accent); }
  .form-field textarea { resize: vertical; min-height: 80px; }
  .form-field select { cursor: pointer; }
  .reserve-submit { margin-top: 1.5rem; width: 100%; text-align: center; }

  footer { background: var(--earth); color: var(--cream); padding: 4rem 2rem 2rem; }
  .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 4rem; max-width: 1400px; margin: 0 auto 3rem; }
  .footer-brand h3 { font-size: 2rem; margin-bottom: 1rem; color: var(--cream); font-weight: 500; }
  .footer-brand h3 span { color: var(--accent); }
  .footer-brand p { color: rgba(243, 240, 235, 0.6); max-width: 320px; font-size: 0.92rem; line-height: 1.7; }
  .footer-brand .wa-cta {
    display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 1.5rem;
    padding: 0.7rem 1.2rem; background: var(--accent); color: var(--cream); text-decoration: none;
    border-radius: 3px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; transition: background 300ms;
  }
  .footer-brand
